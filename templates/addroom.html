<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Add Room</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="mt-5">Add Kamerdata</h1>
                <form method="POST">
                    <div class="mb-3">
                        <label for="kamernummer" class="form-label">Kamer Nummer</label>
                        <input type="text" class="form-control" id="kamernummer" name="kamernummer" required>
                    </div>
                    <div class="mb-3">
                        <label for="naam" class="form-label">Naam</label>
                        <input type="text" class="form-control" id="naam" name="naam" required>
                    </div>
                    <div class="mb-3">
                        <label for="capaciteit" class="form-label">Capacitiet</label>
                        <input type="number" class="form-control" id="capaciteit" name="capaciteit" required>
                    </div>
                    <div class="mb-3">
                        <label for="tafelopstelling" class="form-label">Tafelopstelling</label>
                        <input type="text" class="form-control" id="tafelopstelling" name="tafelopstelling">
                    </div>
                    <div class="mb-3">
                        <label for="beeldscherm" class="form-label">Beeldscherm</label>
                        <input type="text" class="form-control" id="beeldscherm" name="beeldscherm">
                    </div>
                    <div class="mb-3">
                        <label for="type" class="form-label">Type</label>
                        <select class="form-control" id="type" name="type">
                            <option value="vergader">Vergader</option>
                            <option value="kantoor">Kantoor</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+3i4l6Y1Y5boI1GAZp5Yd5nL4e+N" crossorigin="anonymous"></script>
</body>
</html>

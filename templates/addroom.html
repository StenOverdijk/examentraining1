<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Add Room</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="mt-5">Add Kamerdata</h1>
                <form method="POST">
                    <div class="mb-3">
                        <label for="room_number" class="form-label">Kamer</label>
                        <input type="text" class="form-control" id="room_number" name="room_number" required>
                    </div>
                    <div class="mb-3">
                        <label for="capacity" class="form-label">Capacitiet</label>
                        <input type="number" class="form-control" id="capacity" name="capacity" required>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-control" id="status" name="status">
                            <option value=""></option>
                            <option value="Vrij">Vrij</option>
                            <option value="Gereserveerd">Gereserveerd</option>
                            <option value="Bezet">Bezet</option>
                            <option value="Onbeschikbaar">Onbeschikbaar</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="screen" class="form-label">Beeldscherm</label>
                        <input type="text" class="form-control" id="screen" name="screen">
                    </div>
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notities</label>
                        <textarea class="form-control" id="notes" name="notes"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+3i4l6Y1Y5boI1GAZp5Yd5nL4e+N" crossorigin="anonymous"></script>
</body>
</html>

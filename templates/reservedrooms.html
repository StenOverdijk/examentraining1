<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Reserved Rooms</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="mt-5">Reserved Rooms</h1>
                <div class="d-flex justify-content-end mb-3">
                    <a href="{{ url_for('showData') }}" class="btn btn-success">Reserve New Room</a>
                </div>
                <table class="table table-striped mt-3">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kamer Nummer</th>
                            <th>Naam</th>
                            <th>Aantal Personen</th>
                            <th>Startdatum</th>
                            <th>Einddatum</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in reserved_rooms %}
                        <tr>
                            <td>{{ row.id }}</td>
                            <td>{{ row.kamernummer }}</td>
                            <td>{{ row.naam }}</td>
                            <td>{{ row.aantal_personen }}</td>
                            <td>{{ row.startdatum }}</td>
                            <td>{{ row.einddatum }}</td>
                            <td>{{ row.status }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+3i4l6Y1Y5boI1GAZp5Yd5nL4e+N" crossorigin="anonymous"></script>
</body>
</html>

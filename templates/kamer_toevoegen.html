{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Kamer Toevoegen</h2>
    <form method="POST">
        <div class="form-group">
            <label for="kamernummer">Kamer Nummer</label>
            <input type="text" class="form-control" id="kamernummer" name="kamernummer" required>
        </div>
        
        <div class="form-group">
            <label for="naam">Naam</label>
            <input type="text" class="form-control" id="naam" name="naam" required>
        </div>

        <div class="form-group">
            <label for="capaciteit">Capaciteit</label>
            <input type="number" class="form-control" id="capaciteit" name="capaciteit" required>
        </div>

        <div class="form-group">
            <label for="tafelopstelling">Tafelopstelling</label>
            <select class="form-control" id="tafelopstelling" name="tafelopstelling" required>
                <option value="U-vorm">U-vorm</option>
                <option value="Theater">Ovaal</option>
                <option value="Klaslokaal">Klaslokaal</option>
            </select>
        </div>

        <div class="form-group">
            <label for="beeldscherm">Beeldscherm</label>
            <select class="form-control" id="beeldscherm" name="beeldscherm" required>
                <option value="Geen">Geen</option>
                <option value="Projector">Projector</option>
                <option value="TV">TV</option>
                <option value="digibord">Digibord</option>
            </select>
        </div>

        <div class="form-group">
            <label for="type">Type Kamer</label>
            <select class="form-control" id="type" name="type" required>
                <option value="Vergaderzaal">Vergaderzaal</option>
                <option value="Kantoor">Kantoor</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Toevoegen</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Annuleren</a>
    </form>
</div>

<!-- error-->
<div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="errorModalLabel">Foutmelding</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Deze ruimte bestaat al! Probeer een ander kamernummer.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}

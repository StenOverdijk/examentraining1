<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Data from Kamerdata</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="mt-5">Kamerdata</h1>
                <div class="d-flex justify-content-end mb-3">
                    <a href="{{ url_for('add_room') }}" class="btn btn-success">Add Room</a>
                </div>
                <table class="table table-striped mt-3">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kamer Nummer</th>
                            <th>Naam</th>
                            <th>Capacitiet</th>
                            <th>Status</th>
                            <th>Beeldscherm</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in data %}
                        <tr>
                            <td>{{ row.id }}</td>
                            <td>{{ row.kamernummer }}</td>
                            <td>{{ row.naam }}</td>
                            <td>{{ row.capaciteit }}</td>
                            <td>{{ row.tafelopstelling }}</td>
                            <td>{{ row.beeldscherm }}</td>
                            <td>{{ row.type }}</td>
                            <td>
                                <a href="{{ url_for('edit_room', room_id=row.id) }}" class="btn btn-primary">Edit</a>
                                <a href="{{ url_for('delete_room', room_id=row.id) }}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this room?');">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+3i4l6Y1Y5boI1GAZp5Yd5nL4e+N" crossorigin="anonymous"></script>
</body>
</html>
